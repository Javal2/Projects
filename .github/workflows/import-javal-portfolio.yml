name: Import Javal Patel Portfolio
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-javal-portfolio.yml"

permissions:
  contents: write

concurrency:
  group: import-javal-portfolio
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Download current published portfolio
        run: python3 javal-patel-portfolio/scripts/snapshot.py

      - name: Validate snapshot and build
        run: |
          cd javal-patel-portfolio
          node scripts/build.mjs
          test -s dist/index.html
          test -s dist/favicon.png
          test -s dist/work/finchbyte.html

      - name: Commit portfolio source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add javal-patel-portfolio
          if git diff --cached --quiet; then
            echo "Published portfolio is already up to date."
          else
            git commit -m "chore(portfolio): import latest published website snapshot"
            git push origin HEAD:main
          fi
